[project]
name = "mtt-converter"
version = "1.2.0"
description = "multimodal utility module. image(caption, ocr), document(also ocr), 3d model available."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "docling[rapidocr]>=2.114.0",
    "google-genai>=2.12.1",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.15.0",
    "anthropic>=0.117.1",
    "openai>=2.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtt"]
